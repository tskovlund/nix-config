name: "Update flake.lock"

on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 6 * * 1" # Monday at 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@7c4cc317e802185875512bfcb68259257279d767 # v3
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          # Skip the local stub (personal) and zeroclaw-src (pinned to a
          # tag, updating would be a no-op).
          inputs: nixpkgs nix-darwin home-manager agenix nixvim mcp-servers-nix nixos-wsl disko eliza-config
          pr-title: "chore(deps): update flake.lock"
          pr-labels: dependencies
