name: "Update flake.lock"

on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: "0 6 * * 1" # Monday at 06:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/determinate-nix-action@4eea0b33e3d1f02ecfe37cf16e7204c424009606 # v3
      - uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          # Skip the local stub (personal).
          inputs: nixpkgs nix-darwin home-manager agenix nixvim nixos-wsl disko
          pr-title: "chore(deps): update flake.lock"
          pr-labels: dependencies
