name: Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: tskovlund/.github/.github/workflows/nix-check.yml@e923ac2a14c6cf509cd5e30d59fb517e44a8ba67 # main
    with:
      platforms: '["ubuntu-latest", "macos-latest"]'
